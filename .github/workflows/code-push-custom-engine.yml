name: Build Flutter Engine

on:
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: macos-latest

    env:
      DEPOT_TOOLS: ${{ github.workspace }}/depot_tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"

      - name: Add depot_tools to PATH
        run: |
          echo "$DEPOT_TOOLS" >> $GITHUB_PATH

      - name: Sync
        run: |
          cp engine/scripts/standard.gclient .gclient
          cat .gclient
          gclient sync --verbose
          echo "==== ROOT ===="
          ls -la
          echo "==== ENGINE SRC ===="
          ls -la engine/src
          echo "==== BUILDTOOLS ===="
          find . -type d -name buildtools
          echo "==== GN ===="
          find . -name gn

      # - name: Verify depot_tools
      #   run: |
      #     gclient --version
      #     gn --version
      #     ninja --version

      - name: Configure gclient
        run: |
            cp engine/scripts/standard.gclient .gclient

      - name: Sync engine dependencies
        run: |
            gclient sync --with_branch_heads --with_tags

      - name: Run hooks
        run: |
            gclient runhooks

      - name: Verify GN exists
        run: |
            pwd

            echo "Repository root"
            ls

            echo "Engine src"
            ls engine/src

            echo "GN binary"
            ls -la engine/src/buildtools/mac/gn || true

            echo "GN executable"
            file engine/src/buildtools/mac/gn/gn || true

      - name: Build Host Release ARM64
        working-directory: engine/src
        run: |
          ./flutter/tools/gn \
            --runtime-mode=release \
            --mac-cpu arm64

          ninja -C out/host_release_arm64

      - name: Check GN
        working-directory: engine/src
        run: |
            if [ ! -f buildtools/mac/gn/gn ]; then
            echo "GN NOT FOUND"
            find .. -name gn -type f
            exit 1
            fi

      - name: Build Android Release ARM64
        working-directory: engine/src
        run: |
          python3 ./flutter/tools/gn \
          --runtime-mode=release \
          --mac-cpu arm64 \
          --verbose

          ninja -C out/android_release_arm64

      - name: Upload Host Engine
        uses: actions/upload-artifact@v4
        with:
          name: host_release_arm64
          path: engine/src/out/host_release_arm64

      - name: Upload Android Engine
        uses: actions/upload-artifact@v4
        with:
          name: android_release_arm64
          path: engine/src/out/android_release_arm64